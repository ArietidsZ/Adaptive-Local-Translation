name: Offline runtime contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==9.2.0 aiohttp==3.14.5 numpy==2.5.4 ruff==0.15.12
      - run: ruff check config.py model_loading.py asr.py translator.py vad.py web_server.py tests/test_model_settings.py
      - run: python -m pytest tests/test_model_settings.py tests/test_web_server.py tests/runtime -q
